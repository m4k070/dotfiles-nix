name: Update mo

on:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜 0:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Bump mo version and hash
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=home/pkgs/mo/default.nix
          latest=$(gh api repos/k1LoW/mo/releases/latest --jq '.tag_name | ltrimstr("v")')
          current=$(ruby -ne 'puts $1 if /version = "([^"]+)"/' "$file")
          echo "current=$current latest=$latest"
          if [ "$latest" = "$current" ]; then
            exit 0
          fi
          hash=$(nix-prefetch-url "https://github.com/k1LoW/mo/releases/download/v${latest}/mo_v${latest}_linux_amd64.tar.gz")
          ruby -i -pe "
            sub(/version = \"[^\"]+\"/, 'version = \"${latest}\"')
            sub(/sha256 = \"[^\"]+\"/, 'sha256 = \"${hash}\"')
          " "$file"
          git diff --stat
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-mo
          commit-message: "chore: update mo to ${{ steps.bump.outputs.version }}"
          title: "chore: update mo to ${{ steps.bump.outputs.version }}"
          labels: dependencies
          body: "https://github.com/k1LoW/mo/releases/tag/v${{ steps.bump.outputs.version }}"
